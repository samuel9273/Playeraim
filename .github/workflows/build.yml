name: Compilar mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Organizar archivos
        run: |
          mkdir -p src/main/java/com/example/playeraim
          mkdir -p src/main/resources/assets/playeraim/lang
          [ -f PlayerAimClient.java ] && mv PlayerAimClient.java src/main/java/com/example/playeraim/ || true
          [ -f fabric.mod.json ] && mv fabric.mod.json src/main/resources/ || true
          [ -f en_us.json ] && mv en_us.json src/main/resources/assets/playeraim/lang/ || true
          [ -f es_es.json ] && mv es_es.json src/main/resources/assets/playeraim/lang/ || true

      - name: Compilar
        run: gradle build --no-daemon

      - name: Publicar el jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/playeraim-*.jar | grep -v sources | head -n 1)
          gh release create "v1.0.0-${{ github.run_number }}" "$JAR" --title "Player Aim build ${{ github.run_number }}" --notes "Mod para Minecraft 1.21.11 con Fabric"
          
